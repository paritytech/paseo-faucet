name: Configure contract

# Brings the deployed faucet in line with its settings, signed by the operator account, the
# faucet's owner. `destinations` follows `launch()` in contracts/script/Launch.sol through
# contracts/script/Configure.s.sol; `claims` follows the environment's MAX_CLAIMS_PER_EPOCH and
# CLAIM_ASSETS through contracts/script/ConfigureClaims.s.sol. forge simulates the script as the
# account's Ethereum address, which plans a call for each setting the faucet holds differently, and
# deploy/contract.ts sends those calls as Substrate extrinsics. A faucet already in line gets no
# transaction. Otherwise the run simulates again and fails unless nothing is left to change.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that holds the instance's settings
        type: choice
        options:
          - paseo
          - paseo-getcash
        default: paseo
      settings:
        description: Which settings to bring in line
        type: choice
        options:
          - destinations
          - claims
        default: destinations

permissions:
  contents: read

# Every deploy and keep-alive pass signs with the operator account: runs queue, never overlap, and
# are never cancelled midway.
concurrency:
  group: operator
  cancel-in-progress: false

env:
  ETH_RPC: https://eth-rpc-testnet.polkadot.io
  SCRIPT: ${{ inputs.settings == 'claims' && 'ConfigureClaims' || 'Configure' }}

jobs:
  configure:
    name: Configure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: contracts
    env:
      FAUCET_ADDRESS: ${{ vars.FAUCET_ADDRESS }}
      MAX_CLAIMS_PER_EPOCH: ${{ vars.MAX_CLAIMS_PER_EPOCH }}
      CLAIM_ASSETS: ${{ vars.CLAIM_ASSETS }}
      TARGET: ${{ inputs.environment }}
      SETTINGS: ${{ inputs.settings }}
    steps:
      - name: Require main
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::contract changes run only from main"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Check settings
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: |
          required="FAUCET_ADDRESS MNEMONIC"
          if [ "$SETTINGS" = claims ]; then
            required="$required MAX_CLAIMS_PER_EPOCH CLAIM_ASSETS"
          fi
          missing=""
          for name in $required; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::set these on the $TARGET environment:$missing"
            exit 1
          fi
          echo "PLAN=broadcast/$SCRIPT.s.sol/420420417/dry-run/run-latest.json" >> "$GITHUB_ENV"

      - name: Install the deploy tooling
        working-directory: deploy
        run: npm ci

      - name: Find the operator's Ethereum address
        id: sender
        working-directory: deploy
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: npx tsx contract.ts sender

      # forge writes no plan when the script sends nothing, so the script's return value says how
      # many settings differ.
      - name: Simulate
        id: simulate
        env:
          SENDER: ${{ steps.sender.outputs.sender }}
        run: |
          forge script "script/$SCRIPT.s.sol:$SCRIPT" --rpc-url "$ETH_RPC" --sender "$SENDER" --json > "$RUNNER_TEMP/simulate.json"
          changed=$(jq -er 'select(.returns) | .returns.changed.value' "$RUNNER_TEMP/simulate.json")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "::notice::$changed $SETTINGS settings differ"

      # The simulated plan only: forge's cache/ holds the RPC configuration and stays on the runner.
      - if: steps.simulate.outputs.changed != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-configure
          path: contracts/${{ env.PLAN }}
          retention-days: 90

      - name: Configure
        id: configure
        if: steps.simulate.outputs.changed != '0'
        working-directory: deploy
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: npx tsx contract.ts call --plan "../contracts/$PLAN" --contract "$FAUCET_ADDRESS"

      # The Ethereum RPC indexes blocks after the node does: wait until it has the calls' block.
      - name: Check nothing is left to change
        if: steps.simulate.outputs.changed != '0'
        timeout-minutes: 10
        env:
          SENDER: ${{ steps.sender.outputs.sender }}
          BLOCK: ${{ steps.configure.outputs.block }}
        run: |
          until [ "$(cast block-number --rpc-url "$ETH_RPC")" -ge "$BLOCK" ]; do sleep 6; done
          forge script "script/$SCRIPT.s.sol:$SCRIPT" --rpc-url "$ETH_RPC" --sender "$SENDER" --json > "$RUNNER_TEMP/check.json"
          left=$(jq -er 'select(.returns) | .returns.changed.value' "$RUNNER_TEMP/check.json")
          if [ "$left" != 0 ]; then
            echo "::error::$left $SETTINGS settings still differ"
            exit 1
          fi
